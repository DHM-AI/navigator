name: ORACLE — Daily Intelligence

# Dedicated workflow so ORACLE never gets eaten by GitHub's free-tier
# cron scheduler. Runs every weekday night at 10 PM ET (2 AM UTC next day).
# Also runs on Saturday morning to capture week-end learnings.

on:
  schedule:
    - cron: '0 2 * * 2-6'    # Mon–Fri 10 PM ET (= 2 AM UTC Tue-Sat)
    - cron: '0 14 * * 6'     # Saturday 10 AM ET — weekend learning sweep
  workflow_dispatch:          # manual trigger from GitHub Actions UI

jobs:
  oracle:
    runs-on: ubuntu-latest
    # ⛔⛔ RAISED 10 -> 30 on 2026-08-04. ORACLE had NEVER COMPLETED A SINGLE RUN.
    # Every scheduled run since at least 2026-07-29 was killed at the cap — the
    # durations read 10m17s, 10m18s, 10m20s, 10m21s, 10m25s, which is the timeout,
    # not the job. GitHub reports a timeout kill as "cancelled", NOT "failure", so
    # it never turned a run red, never alerted, and never appeared in
    # `gh run list --status failure`. Weeks of silence that looked like health.
    # ⭐ Learnings still had today's date, which is what made it invisible: ORACLE
    #    writes the learning record partway through, then gets killed before
    #    finishing the rest of the cycle. A fresh timestamp proved it STARTED,
    #    and was read as proof it worked.
    # ⭐ ROOT CAUSE FOUND after raising this — the cap was the symptom, not the bug.
    #    analyst/oracle.py ran a FULL XGBoost retrain inline (model.trainer.train)
    #    whenever hit_rate < 0.50, which the measured ~47-50% directional hit rate
    #    made true almost every night. No timeout would have fixed that; 30 min was
    #    not enough either (a dispatched run was still going at 26 min). The retrain
    #    is removed — GENESIS owns retraining, monthly. ORACLE now finishes in ~1 min.
    # ⛔ 30 min is deliberate headroom, NOT a requirement. If a run ever approaches
    #    it again, something re-introduced heavy work — look for that, don't raise this.
    timeout-minutes: 30

    env:
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_LIVE_MODE:   ${{ secrets.ALPACA_LIVE_MODE }}
      SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-agent.txt

      - name: Run ORACLE intelligence cycle
        run: python -c "from analyst.oracle import run; run()"
