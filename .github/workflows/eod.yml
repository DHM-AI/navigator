name: End of Day

on:
  # ── GitHub cron schedule DISABLED 2026-06-08 (audit Findings #2, #12) ─────────
  # Both EOD jobs now run on local macOS launchd, which is reliable (GitHub cron
  # fired zero jobs on 2026-06-05) and DST-safe (fixed at 13:50 / 14:15 Mountain =
  # 3:50 / 4:15 PM ET year-round, since MT is a constant 2h behind ET). The old
  # 3:50 GitHub cron drifted to 2:50 PM ET in winter (EST) and would have closed
  # positions MID-SESSION. launchd jobs:
  #   - com.illuminati.dusk → dusk_trigger.sh → close_intraday.py (3:50 PM ET)
  #   - com.illuminati.eod  → eod_trigger.sh  → eod_report.py     (4:15 PM ET)
  # Kept as workflow_dispatch for manual runs. Crons preserved for reference:
  # schedule:
  #   - cron: '50 19 * * 1-5'   # 3:50 PM ET — close intraday positions
  #   - cron: '15 20 * * 1-5'   # 4:15 PM ET — send EOD report
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which step to run'
        required: false
        default: 'both'
        type: choice
        options: [close_intraday, eod_report, both]
      force:
        description: 'Set true to ACTUALLY run. launchd owns DUSK + the EOD report; a bare dispatch (leftover cron-job.org jobs) no-ops — a GitHub DUSK could close positions mid-session.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Concurrency group REMOVED 2026-06-09: DUSK + EOD run launchd-only now and the job is
# force-guarded, so there are no concurrent GitHub runs to serialize. The group only
# caused "all jobs cancelled" emails when leftover cron-job.org dispatches superseded
# each other; without it, those bare dispatches finish instantly as SKIPPED.

jobs:
  eod:
    # launchd owns DUSK (close_intraday, 3:50 ET) + the EOD report (4:15 ET). A
    # bare dispatch — e.g. leftover cron-job.org jobs hitting the API — must NOT
    # run: a GitHub DUSK could close positions mid-session and race launchd.
    # Only an explicit forced manual run executes. (2026-06-09)
    if: ${{ github.event.inputs.force == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_LIVE_MODE:  ${{ secrets.ALPACA_LIVE_MODE }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BANKROLL:          ${{ secrets.BANKROLL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-agent.txt

      - name: AEGIS — trailing stops + partial exits
        run: python -c "from execution.alpaca import trail_positions; r=trail_positions(); print(f'[AEGIS] {len(r)} actions')"

      - name: Close intraday positions (3:50 PM)
        if: |
          github.event.schedule == '50 19 * * 1-5' ||
          github.event.inputs.mode == 'close_intraday' ||
          github.event.inputs.mode == 'both'
        run: python close_intraday.py

      - name: Send EOD report (4:15 PM)
        if: |
          github.event.schedule == '15 20 * * 1-5' ||
          github.event.inputs.mode == 'eod_report' ||
          github.event.inputs.mode == 'both'
        run: python eod_report.py
