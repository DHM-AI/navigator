name: Monthly Model Retrain

# PAUSED 2026-06-02: auto-retrain is the prime suspect in the profitability
# swing — the 5/27 retrain (AUC 0.65→0.76) started LOSING the day it deployed
# (overfit: better backtest, worse live), and on 6/2 GENESIS auto-pushed yet
# another fresh model that would have overwritten our rollback to the proven
# AUC 0.655 model. The scheduled + push triggers are DISABLED so no new model
# lands automatically. Retrain ONLY manually (workflow_dispatch) after a model
# has been validated in paper. Re-enable the cron once retrains are trusted.
on:
  # schedule:
  #   - cron: '0 10 1-7 * 1'  # DISABLED — see note above
  # push:
  #   paths:
  #     - 'model/trainer.py'
  #     - 'signals/technicals.py'
  workflow_dispatch:           # Manual trigger ONLY (Actions tab) — no auto-retrain

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120       # CI runners are ~2-3x slower than local M-series;
                               # 5yr XGBoost train alone can take 50+ min on a
                               # GitHub ubuntu runner. 2026-06-01 run FAILED at
                               # 58:28 against the old 60-min cap. 120 gives slack.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ILLUMINATI_PAT }}   # needed to push model artifacts back

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-agent.txt

      - name: Train XGBoost model
        run: python -m model.trainer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Commit updated model artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the freshly-trained artifacts by hash BEFORE any rebase, so we
          # can re-apply them on top of the latest remote. The model files are
          # BINARY — `git pull --rebase` CANNOT auto-merge them and will halt on
          # conflict (this is why the 2026-06-01 run's retry loop failed). The
          # newly trained model is always authoritative, so "ours wins" cleanly.
          ARTIFACTS="model/saved/xgb_model.pkl model/saved/feature_names.json model/saved/calibrator.pkl"

          git add $ARTIFACTS || true
          if git diff --staged --quiet; then
            echo "No model changes to commit — skipping push"
            exit 0
          fi
          git commit -m "chore: monthly model retrain + Platt calibration [skip ci]"

          # Push with conflict-safe retry. streamlit_refresh fires at the same
          # 10:00 UTC slot and pushes deploy-stamp commits during the long train,
          # so the push can hit a non-fast-forward. On rejection: fetch latest,
          # hard-reset to origin/main, re-checkout OUR trained artifacts from the
          # commit we just made, re-commit, retry. Binary-safe (no merge attempt).
          OUR_COMMIT=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected — re-basing artifacts onto latest origin/main"
            git fetch origin main
            git reset --hard origin/main
            git checkout "$OUR_COMMIT" -- $ARTIFACTS
            git add $ARTIFACTS
            if git diff --staged --quiet; then
              echo "Artifacts already current on origin — nothing to push"
              exit 0
            fi
            git commit -m "chore: monthly model retrain + Platt calibration [skip ci]"
            OUR_COMMIT=$(git rev-parse HEAD)
            sleep 5
          done
          echo "ERROR: model push failed after 5 attempts"
          exit 1

      - name: Notify Slack on completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"; MSG="Monthly retrain *complete*. New model pushed to repo."
          else
            ICON="❌"; MSG="Monthly retrain *FAILED*. Check Actions logs."
          fi
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"$ICON *XGBoost Retrain — $(date +'%b %Y')* \\n$MSG\"}"
