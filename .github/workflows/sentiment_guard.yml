name: Sentiment Guard

on:
  # ── GitHub cron DISABLED 2026-06-09 (audit H-22) ────────────────────────────
  # This was the LAST workflow still running on an active GitHub schedule with
  # no force-guard — a cloud path that can tighten stops / close positions,
  # racing the local launchd AEGIS/VIGIL. Same policy as daily_scan/trail_stops/
  # eod: launchd is the sole automated path; a bare dispatch no-ops.
  # schedule:
  #   - cron: '0 13,14,15,16,17,18,19,20 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Set true to ACTUALLY run. Bare dispatches no-op.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  guard:
    if: ${{ github.event.inputs.force == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ALPHA_VANTAGE_KEY:  ${{ secrets.ALPHA_VANTAGE_KEY }}
      SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
      ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_LIVE_MODE:   ${{ secrets.ALPACA_LIVE_MODE }}
      BANKROLL:           ${{ secrets.BANKROLL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-agent.txt

      - name: Run sentiment guard
        run: python sentiment_guard.py
