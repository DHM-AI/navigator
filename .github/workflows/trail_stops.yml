name: Trailing Stop Manager

on:
  # ── GitHub cron schedule DISABLED 2026-06-08 ──────────────────────────────────
  # AEGIS now runs SOLELY on local macOS launchd (com.illuminati.aegis, every
  # 20 min during market hours) — same as scan / DUSK / EOD. Why:
  #  - The concurrency group below only de-dupes GitHub-vs-GitHub runs; it does
  #    NOT stop a GitHub AEGIS run from racing the LOCAL launchd AEGIS, which
  #    could double-fire partial exits / fight over stops. launchd-only removes it.
  #  - GitHub cron is unreliable and was emitting "all jobs cancelled" emails
  #    (concurrency superseding queued runs every 15 min).
  #  - Open positions keep their GTC stops on Alpaca's servers regardless, and the
  #    heartbeat alerts if the Mac (and thus AEGIS) goes silent.
  # Kept as workflow_dispatch for manual runs. Crons preserved for reference:
  # schedule:
  #   - cron: '0,15,30,45 13,14,15,16,17,18,19,20 * * 1-5'   # every 15 min, mkt hrs
  #   - cron: '0 12 * * 1-5'   # 8 AM ET pre-market
  #   - cron: '0 21 * * 1-5'   # 5 PM ET post-close
  #   - cron: '0 13 * * 6'     # Sat 9 AM ET
  #   - cron: '0 13 * * 0'     # Sun 9 AM ET
  #   - cron: '0 22 * * 0'     # Sun 6 PM ET
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI
    inputs:
      force:
        description: 'Set true to ACTUALLY run AEGIS. launchd owns it (every 20 min); a bare dispatch (leftover cron-job.org jobs) no-ops.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Concurrency group REMOVED 2026-06-09: AEGIS runs launchd-only now and the job is
# force-guarded, so there are no concurrent GitHub runs to serialize. The group only
# caused "all jobs cancelled" emails when leftover cron-job.org dispatches superseded
# each other; without it, those bare dispatches finish instantly as SKIPPED.

jobs:
  trail:
    # launchd owns AEGIS (com.illuminati.aegis, every 20 min). A bare dispatch —
    # e.g. the leftover cron-job.org jobs hitting the GitHub API — must NOT run
    # AEGIS: it would race the local AEGIS and could double-fire partial exits.
    # Only an explicit forced manual run executes. (2026-06-09)
    if: ${{ github.event.inputs.force == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_LIVE_MODE:  ${{ secrets.ALPACA_LIVE_MODE }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      BANKROLL:          ${{ secrets.BANKROLL }}
      SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-agent.txt

      - name: Run trailing stop check
        run: python trail_stops.py
