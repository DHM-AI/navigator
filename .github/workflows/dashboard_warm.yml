name: Dashboard Keep-Warm

# Why this exists (2026-06-02):
# The Cloudflare dashboard worker returns HTTP 503 ONLY on a cold compute that
# throws with no stale cache yet — i.e. the first request after the 10-min stale
# cache expires AND a transient upstream (Alpaca/Supabase) hiccup hits. Once the
# stale cache is populated, any future compute failure falls back to it (200).
#
# So the cure is simple: never let the stale cache go empty. A lightweight ping
# every few minutes keeps the 10-min stale copy always fresh, which means:
#   1. Renato's first dashboard load of the day is instant (no cold 503), and
#   2. ZEUS's 11 PM health check finds a warm worker (no false-alarm WARN).
#
# This only curls a public URL — no checkout, no secrets, no commit.

on:
  schedule:
    # Market hours + buffer (13–21 UTC = ~9 AM–5 PM ET): every 5 min keeps the
    # 10-min stale cache continuously warm even if Actions delays a tick.
    - cron: '*/5 13-21 * * 1-5'
    # Off-hours: every 30 min so the dashboard is still responsive if checked.
    - cron: '*/30 0-12,22-23 * * *'
    # Warm-up right before ZEUS runs (ZEUS = 11 PM ET = 03:00 UTC) so its
    # health check never catches a cold worker.
    - cron: '55 2 * * *'

  workflow_dispatch: {}   # manual warm on demand

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard API to keep stale cache warm
        run: |
          echo "Warming dashboard worker + stale cache..."
          for i in 1 2; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
              -H "User-Agent: illuminati-keepwarm" \
              "https://illuminati-dashboard.pages.dev/api/dashboard" || echo "000")
            echo "  ping $i: HTTP $CODE"
            # First ping may catch a cold 503; the second confirms it warmed.
            [ "$CODE" = "200" ] && exit 0
            sleep 3
          done
          echo "Dashboard did not return 200 after 2 pings (worker may be waking)"
          # Don't fail the job — ZEUS owns real outage alerting; this is best-effort.
          exit 0
