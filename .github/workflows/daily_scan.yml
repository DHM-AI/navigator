name: Illuminati — Daily Scan (ARGUS · CIPHER · PYTHIA · THEMIS · APEX · ORACLE)

on:
  # ── GitHub cron schedule DISABLED 2026-06-08 (audit Findings #2, #8, #12) ─────
  # The scan pipeline PLACES ORDERS. Running it from BOTH GitHub Actions crons and
  # the local macOS launchd scanner (com.illuminati.scan, every 30 min) with no
  # cross-process dedup risked DOUBLE orders / double exposure (#2). GitHub's cron
  # also drifts 1h in winter EST (#12), and the old "skips if a scan ran in the
  # last 50 min" comment was false — no such throttle existed (#8).
  #
  # launchd is now the SOLE automated scan path: it is reliable (GitHub cron had
  # been firing zero scans) and DST-safe (gates on America/New_York local time).
  # Trade-off: if the Mac is asleep/off, scans don't run — a SAFE failure (missed
  # opportunity, never a bad/duplicate trade). Re-enable a cloud backup later only
  # with a shared "scan already ran" dedup gate. The crons are preserved as
  # comments below for reference / quick re-enable.
  #
  # schedule:
  #   - cron: '0 11 * * 1-5'    #  7:00 AM ET
  #   - cron: '0 12 * * 1-5'    #  8:00 AM ET
  #   - cron: '0 13 * * 1-5'    #  9:00 AM ET
  #   - cron: '30 13 * * 1-5'   #  9:30 AM ET
  #   - cron: '0 14 * * 1-5'    # 10:00 AM ET
  #   - cron: '30 14 * * 1-5'   # 10:30 AM ET
  #   - cron: '0 15 * * 1-5'    # 11:00 AM ET
  #   - cron: '0 16 * * 1-5'    # 12:00 PM ET
  #   - cron: '0 17 * * 1-5'    #  1:00 PM ET
  #   - cron: '0 18 * * 1-5'    #  2:00 PM ET
  #   - cron: '0 19 * * 1-5'    #  3:00 PM ET
  # (ORACLE 10 PM ET is owned by oracle.yml; AEGIS by trail_stops.yml + launchd.)

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'scan'
        type: choice
        options: [scan, postmortem, scan-no-trade]

# Audit 2026-06-02: the scan pipeline runs the AEGIS partial-exit engine
# (agent.py -> trail_positions). GitHub's free-tier scheduler queues delayed
# ticks and flushes them in bursts (observed: 5 runs 2-4 min apart at 22:xx),
# which previously ran the full pipeline — and AEGIS — CONCURRENTLY. Serialize
# daily_scan with itself so only one runs at a time; queued bursts run one-by-one
# instead of stacking concurrent AEGIS passes. cancel-in-progress:false so an
# in-flight scan/trade is never killed mid-run. (Own group, not shared 'aegis',
# so a 12-min scan can't starve the 15-min trail_stops job.)
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    # Bumped 30 → 60 min — yfinance rate limiting + delisted-ticker timeouts
    # were causing 30-min timeouts. Most scans complete in ~10-15 min but
    # under rate-limit conditions can run 25-40 min.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-agent.txt

      - name: Run agent
        run: |
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event.inputs.mode }}" = "postmortem" ]; then
            python -c "from analyst.oracle import run; run()"
          elif [ "${{ github.event.inputs.mode }}" = "scan-no-trade" ]; then
            python agent.py --no-trade
          else
            # Mark fallback triggers so the agent can skip if already scanned
            case "$SCHED" in
              "30 11 * * 1-5"|"30 12 * * 1-5"|"30 15 * * 1-5"|"30 16 * * 1-5"|"30 17 * * 1-5"|"30 18 * * 1-5")
                export SCAN_FALLBACK=true ;;
            esac
            python agent.py
          fi
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALPHA_VANTAGE_KEY:  ${{ secrets.ALPHA_VANTAGE_KEY }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_LIVE_MODE:   ${{ secrets.ALPACA_LIVE_MODE }}
          BANKROLL:           ${{ secrets.BANKROLL }}
